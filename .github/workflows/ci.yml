name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # hexol is a Guix project: manifest.scm is the source of truth for
      # dependencies (guile + guile-json + guile-libyaml + jq). We provision
      # the same environment in CI rather than re-deriving it from apt — among
      # other things, the (yaml) module comes from guile-libyaml, which isn't
      # packaged for Ubuntu.
      - name: Install Guix
        run: |
          wget -qO /tmp/guix-install.sh \
            https://git.savannah.gnu.org/cgit/guix.git/plain/etc/guix-install.sh
          yes | sudo bash /tmp/guix-install.sh
          # Make `guix` available to later steps.
          echo "/var/guix/profiles/per-user/root/current-guix/bin" >> "$GITHUB_PATH"

      - name: Show Guix version
        run: guix --version

      # Single step so the substitutes are fetched once. `guix shell -m
      # manifest.scm --` runs the command with exactly the manifest's packages
      # on PATH and GUILE_LOAD_PATH; `make` then uses the Guix `guile`.
      - name: Build, test, and smoke-test examples
        run: |
          guix shell -m manifest.scm -- make build test test-examples
